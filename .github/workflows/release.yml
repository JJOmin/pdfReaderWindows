# Builds the installers (Windows, and the Mac's .dmg) and attaches them to a GitHub release, when a
# version tag is pushed (git tag v1.2.3 && git push origin v1.2.3). The speech voices that the app
# carries are downloaded for the build (about 700 MB, cached). Nothing is signed with a purchased
# certificate (ADR 9): the Mac app is ad hoc signed, and Windows will ask "unknown publisher".
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-latest
            script: dist
            files: dist/*.exe
          - name: Mac disk image
            os: macos-latest
            script: dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/cache@v4
        with:
          path: models
          key: models-recommended-${{ matrix.os }}-${{ hashFiles('models.json') }}
      - run: npm run models
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          generate_release_notes: true
